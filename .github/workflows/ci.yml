# Required CI: both named jobs are enforced by main branch protection and
# Vercel project checks. Keep their names stable when changing this workflow.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (errors fail; warnings are a backlog)
        run: npm run lint
      - run: npm run build
      - name: Router import
        run: node -e "import('./api/router.js').then(() => console.log('router import ok'))"
      - run: npm test
      - name: Supplied-text client tests
        run: node --experimental-strip-types --test scripts/corpus-text-import.test.mjs scripts/law-listing-reconcile.test.mjs scripts/record-mapping-repair.test.mjs scripts/corpus-readiness-export.test.mjs
      - name: Law cohort screener tests
        run: python3 -I scripts/law-cohort-screen.test.py
      - name: Tests leave committed data untouched
        run: git diff --exit-code -- public/
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests
        run: deno test -A --config supabase/functions/deno.json supabase/functions
      - name: Bulk runner tests
        run: deno test -A --config supabase/functions/deno.json scripts/bulk-runner
      - name: Bulk runner lint and format
        run: |
          deno lint --config supabase/functions/deno.json scripts/bulk-runner
          deno fmt --check --config supabase/functions/deno.json scripts/bulk-runner

  sql:
    name: SQL fixtures (disposable Postgres)
    runs-on: ubuntu-latest
    # 17 to 19.5 minutes on 2026-11-07, and cancelled twice at the old 20 (F302).
    # run.sh prints each fixture's seconds; split the job before this is reached.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The image first runs a socket-only init server; TCP readiness means the
      # real server is up.
      - name: Start the two local databases
        run: |
          docker run -d --name niyantran-recovery-db -e POSTGRES_PASSWORD=postgres postgres:17-alpine
          docker run -d --name niyantran-corpus-test-db -e POSTGRES_PASSWORD=postgres pgvector/pgvector:pg17
          for c in niyantran-recovery-db niyantran-corpus-test-db; do
            for i in $(seq 1 60); do
              docker exec "$c" pg_isready -h 127.0.0.1 -U postgres -q && break
              sleep 1
            done
            docker exec "$c" pg_isready -h 127.0.0.1 -U postgres
          done
      # A fixture with no chain() entry must fail the run, not end it with exit 0 (F303).
      - name: An unknown fixture fails
        run: |
          if ./supabase/tests/run.sh no_such_fixture; then
            echo "run.sh passed an unknown fixture"; exit 1
          fi
      - run: npm run test:sql
